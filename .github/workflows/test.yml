name: test

on:
  push:
    branches: [master]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            cloud_run/qloo_gateway/package-lock.json
            dashboard/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      # No secrets: the suites run on fixtures. The calibration reproduction skips itself without private data.
      - name: Python suites
        run: |
          pip install -r requirements-dev.txt
          pytest

      - name: Gateway
        working-directory: cloud_run/qloo_gateway
        run: |
          npm ci
          npm test
          npm run typecheck

      - name: Dashboard
        working-directory: dashboard
        run: |
          npm ci
          npm test
          npm run build

      - name: Public data check
        run: bash scripts/check-public-data.sh
