<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="base.css"><style>.hd{font-size:14px;font-weight:700;letter-spacing:.5px;text-transform:uppercase;color:var(--muted)}.row{position:absolute;left:40px;width:1420px;height:92px;background:var(--panel);border:1.5px solid var(--line);border-radius:10px}.row.k{border-color:var(--accent)}.c{position:absolute;top:0;bottom:0;display:flex;flex-direction:column;justify-content:center;font-size:15.5px;line-height:1.3;color:var(--muted)}.c b{color:var(--text);font-weight:600}.n{font-size:18px;font-weight:700;color:var(--text)}.k .n{color:var(--accent)}</style></head><body><div id="c"></div>

title("What stands between the model and you", "Each layer checks the model's output against the data or a fixed rule. Rates are from planted errors, not live traffic.");
h("Layer", "hd abs", 70, 112); h("What it stops", "hd abs", 360, 112); h("How", "hd abs", 740, 112); h("Result", "hd abs", 1110, 112);
const R = [
  ["Claim checker", "A written claim with a number or name that is not in the Qloo results it cites", "Numbers and names must appear in the cited results. A failing claim is struck, never rewritten.", "<b>10 of 10</b> planted false claims removed", 1],
  ["Strategist answer check", "A number in a chat answer that is in no tool result or board score", "Unmatched numbers are flagged on the answer.", "<b>20 of 20</b> caught; <b>0 of 20</b> false alarms", 1],
  ["Document citation check", "A number cited to a page of your document that is not on that page", "A cited sentence is checked against its own page only.", "<b>20 of 20</b> caught; <b>0 of 20</b> false alarms", 1],
  ["Advance filter", "Visa or equipment notes from another country's pages, or numbers not in the source", "Country check on each source, then every number must be in the item's own source.", "<b>20 of 20</b> caught; <b>0 of 20</b> false alarms", 1],
  ["Sponsor check", "Non-profit, advocacy, political and religious groups on the sponsor card", "One batched model question plus a short disclosed name list. Unanswered brands are hidden.", "<b>18 of 20</b> caught; <b>3 of 20</b> false alarms. Name list alone: 12 of 20, 0 of 20", 1],
  ["Do-not-book list", "Acts on a short list (currently one) appearing as picks", "Applied when the page is drawn. Affected cards say so.", "A rule, not a measured rate", 0],
  ["Pre-registered tests", "Choosing the story after the results", "Protocol committed before any call, 10 dated amendments, losses published.", "Wins and losses on <span class='mono'>/proof</span>", 0],
];
R.forEach((r, i) => {
  const y = 138 + i * 100;
  const d = h("", "row" + (r[4] ? " k" : ""), 40, y);
  d.style.top = y + "px";
  const cell = (x, w, html) => { const c = document.createElement("div"); c.className = "c"; c.style.left = x + "px"; c.style.width = w + "px"; c.innerHTML = `<div>${html}</div>`; d.appendChild(c); };
  cell(20, 300, `<span class="n">${i + 1}. ${r[0]}</span>`);
  cell(320, 350, r[1]); cell(700, 340, r[2]); cell(1070, 330, r[3]);
});
h("These are checks, not comparisons, so there is no significance test. The fixtures are synthetic and small. The sponsor figure measures the rule against fixed fake classifier outputs, not the live model.", "abs", 40, 850, 1420).style.cssText += "font-size:15.5px;line-height:1.4;color:#a4a094";
legend([["#ffcc00", "Measured with planted errors"], ["#4a473c", "Rule or process", "border-style:solid"]]);
finish();
